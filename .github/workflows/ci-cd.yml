
name: FOXSO Complete CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foxso-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------
  # STAGE 1: FRONTEND CI
  # --------------------------------
  frontend-ci:
    name: Frontend CI - React Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build React application
        working-directory: frontend
        run: npm run build

  # --------------------------------
  # STAGE 2: BACKEND CI
  # --------------------------------
  backend-ci:
    name: Backend CI - FastAPI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check Python syntax
        working-directory: backend
        run: python -m compileall -q app

  # --------------------------------
  # STAGE 3: DOCKER BUILD AND PUSH
  # --------------------------------
  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - frontend-ci
      - backend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          tags: |
            ankitachoudhary2005/foxso-frontend:latest
            ankitachoudhary2005/foxso-frontend:${{ github.sha }}
          cache-from: type=gha,scope=foxso-frontend
          cache-to: type=gha,mode=max,scope=foxso-frontend

      - name: Build and Push Backend Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: |
            ankitachoudhary2005/foxso-backend:latest
            ankitachoudhary2005/foxso-backend:${{ github.sha }}
          cache-from: type=gha,scope=foxso-backend
          cache-to: type=gha,mode=max,scope=foxso-backend

  # --------------------------------
  # STAGE 4: AUTOMATIC DEPLOYMENT
  # --------------------------------
  deploy:
    name: Deploy FOXSO on Rocky Linux
    runs-on: [self-hosted, linux, x64, foxso-deploy]

    needs:
      - docker-publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application
        env:
          FOXSO_IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          cd /opt/foxso

          echo "Pulling updated FOXSO images..."
          docker compose pull backend frontend

          echo "Starting updated application..."
          docker compose up -d --no-build --remove-orphans

      - name: Verify database health
        run: |
          cd /opt/foxso

          for attempt in {1..15}; do
            if docker compose exec -T db sh -c \
              'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
              echo "Database is healthy"
              exit 0
            fi
            sleep 5
          done

          echo "Database health check failed"
          docker compose logs db
          exit 1

      - name: Verify backend health
        run: |
          cd /opt/foxso

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo "Backend health check passed"
              exit 0
            fi
            sleep 5
          done

          echo "Backend health check failed"
          docker compose logs backend
          exit 1

      - name: Verify frontend
        run: |
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/ -o /dev/null; then
              echo "Frontend is accessible"
              exit 0
            fi
            sleep 5
          done

          echo "Frontend health check failed"
          cd /opt/foxso
          docker compose logs frontend
          exit 1

